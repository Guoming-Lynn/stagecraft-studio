repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        always_run: true
      - id: hygiene
        name: hygiene
        entry: uv run python scripts/check_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
      - id: prettier
        name: prettier
        entry: pnpm -C web exec prettier --check .
        language: system
        pass_filenames: false
        always_run: true
