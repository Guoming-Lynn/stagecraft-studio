[alembic]
script_location = %(here)s/stagecraft_studio/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///stagecraft.sqlite

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
